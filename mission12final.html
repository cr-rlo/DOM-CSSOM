<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>[ANSWER] 최적화된 신상품 피드</title>
  <style>
    :root{--row-h:92px;--maxw:1000px}
    body{margin:0;font-family:sans-serif;background:#f7f7f7}
    header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;font-weight:700}
    /* 상품 한 줄의 높이를 92픽셀로, 최대 가로폭을 1000픽셀로 고정
    header{ }: 사용자가 스크롤을 아래로 내려도 상단 헤더 제목줄이 화면 맨 위에 찰싹 달라붙어서 따라오게 만듦 */

    #viewport{height:560px;overflow-y:auto;border:1px solid #ccc;border-radius:10px;max-width:var(--maxw);margin:20px auto;position:relative;background:#fff}
    /* height:560px와 overflow-y:auto;를 주어, 화면 전체가 아니라 딱 560픽셀 높이 안에서만 스크롤이 생기도록 제한된 창문을 만듦 */

    #scroll-area{position:relative}
    .row{position:absolute;left:0;right:0;height:var(--row-h);display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid #eee}
    /* #scroll-area에 relative를 줘서 자식요소의 row의 기준 
    .row position: absolute;와 left: 0; right: 0;을 주어, 앞서 이야기 나눴던 것처럼 좌우 양옆으로 팽팽하게 늘어나고 가상 리스트 안에서 내 위치(top)를 자유롭게 잡을 수 있는 상태로 만듦  */

    .thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#ddd;opacity:.2;transition:opacity .3s}
    .thumb.loaded{opacity:1}
    /* object-fit: cover: 사진의 비율이 이상하더라도, 찌그러지지 않고 썸네일 박스 안에 가득 차게 잘라서 채우기 */

    .title{font-weight:600}
    .actions button{background:#111;color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
    .sentinel{height:1px}
    /* 화면 맨 아래에 숨어 있다가, 사용자가 스크롤을 내려서 이 1픽셀짜리 막대기가 눈에 보이는 순간 "어? 끝에 도달했네! 다음 페이지 데이터를 서버에서 가져와!" 하고 무한 스크롤을 실행시키는 방화벽 역할 */
    .tail{max-width:var(--maxw);margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:#fff;padding:12px;border:1px solid #ddd;border-radius:10px}
    video{width:100%;border-radius:10px;background:#000}
    .placeholder{height:160px;display:flex;align-items:center;justify-content:center;background:#eee;border-radius:10px;color:#777}
  </style>
</head>
<body>
<header>신상품 피드 (Virtualized)</header>
<div id="viewport"><div id="scroll-area"></div><div id="sentinel" class="sentinel"></div></div>

<section class="tail">
  <article class="card">
    <h3>추천 영상</h3>
    <video id="promo" preload="none" poster="https://images.unsplash.com/photo-1520975922215-230f3cd8a487?w=600&q=80&auto=format&fit=crop" controls>
      <source data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>
  </article>
  <article class="card">
    <h3>광고 & 분석</h3>
    <div id="ad" class="placeholder">광고 준비중…</div>
    <div id="ana" class="placeholder">분석 준비중…</div>
  </article>
</section>

<script>
  const ROW_H=92,PAGE=500,MAX=5,vm=document.getElementById('viewport'),area=document.getElementById('scroll-area'),sent=document.getElementById('sentinel');
  let items=[],page=0,loading=false;

  async function loadPage(){
    if(loading||page>=MAX)return;loading=true;
    await new Promise(r=>setTimeout(r,200));
    const start=page*PAGE;
    const chunk=Array.from({length:PAGE},(_,i)=>({id:start+i+1,title:`상품 #${start+i+1}`,img:`https://picsum.photos/seed/${start+i+1}/128/128`,price:(Math.random()*90000+10000|0).toLocaleString('ko-KR')}));
    items=items.concat(chunk);page++;
    area.style.height=(items.length*ROW_H)+'px';render();loading=false;
  }

  function render(){
    const top=vm.scrollTop,vh=vm.clientHeight;
    const start=Math.max(0,Math.floor(top/ROW_H)-5),end=Math.min(start+Math.ceil(vh/ROW_H)+10,items.length);
    area.innerHTML='';
    for(let i=start;i<end;i++){
      const p=items[i];
      const row=document.createElement('div');row.className='row';row.style.top=(i*ROW_H)+'px';
      row.innerHTML=`<img class="thumb" width="72" height="72" alt="${p.title}" data-src="${p.img}">
      <div style="flex:1"><div class="title">${p.title}</div><div>₩${p.price}</div></div>
      <div class="actions"><button>담기</button></div>`;
      area.appendChild(row);
    }
    observeImgs();
  }

  const imgIO=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const img=e.target;img.src=img.dataset.src;img.onload=()=>img.classList.add('loaded');imgIO.unobserve(img);
      }
    });
  },{root:vm,rootMargin:'200px 0px'});
  function observeImgs(){area.querySelectorAll('img[data-src]').forEach(i=>imgIO.observe(i));}

  vm.addEventListener('scroll',render,{passive:true});
  const loadIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)loadPage();});},{root:vm,rootMargin:'800px 0px'});loadIO.observe(sent);

  const promo=document.getElementById('promo');
  const vidIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){promo.querySelectorAll('source[data-src]').forEach(s=>{s.src=s.dataset.src;s.removeAttribute('data-src');});promo.load();vidIO.unobserve(promo);}});},{root:null,rootMargin:'400px 0px'});vidIO.observe(promo);

  const ad=document.getElementById('ad'),ana=document.getElementById('ana');
  const scriptIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){ad.textContent='광고 로드 완료';ana.textContent='분석 스크립트 실행';scriptIO.disconnect();}});},{root:null,rootMargin:'200px 0px'});
  scriptIO.observe(ad);scriptIO.observe(ana);

  loadPage();
</script>
</body>
</html>
