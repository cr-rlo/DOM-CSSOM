<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>[ANSWER] 안정적 초기화 + 데이터 보호 + 로그 신뢰성 + 파싱 최적화</title>

  <!-- 외부 SDK: async로 병렬 다운로드, 파싱 차단 제거 -->
  <script src="data:text/javascript;charset=utf-8,
    (function(){
      setTimeout(function(){
        console.log('[ANSWER SDK] async 로딩(파싱 차단 없음) + 비동기 초기화 완료');
      }, 0);
    })();
  " async></script>
  <!-- 
    여기서 async는 비동기 함수를 의미하는 것이 아니라 HTML의 태그 속성
    브라우저에게 이 외부 스크립트를 다운로드할 때, HTML글을 읽는 것을 멈추게 하지 말고 백그라운드에서 따로 다운해라는 명령
    src 안에는 원래 외부 자바스크립트 파일의 주소가 들어가야 함
    하지만 여기에서는 data:text..방식을 써서 코드 자체를 문자열로 집어넣음
    자바스크립트에게 function--의 코드가 다운되자마자 곧바로 실행해달라는 것을 알리기 위해서 즉시 실행함수라는 껍데기로 감싸기
   -->

  <style>
    :root { --pad: 24px; --bg: #0b1220; --fg: #e5e7eb; --muted:#94a3b8; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --fg:#0b1220; --muted:#475569; }
    }
    body { font-family: system-ui, sans-serif; margin: var(--pad); background: var(--bg); color: var(--fg); }
    header { margin-bottom: 12px; }
    #username .badge { background:#ef4444; color:#fff; padding:2px 6px; margin-left:8px; border-radius:12px; font-size:12px; }
    #card { background: color-mix(in srgb, var(--fg), transparent 85%); margin-top: 10px; display:flex; align-items:center; justify-content:center; transition: height .2s ease; }
    textarea { width: 100%; height: 160px; margin-top: 16px; color: inherit; background: color-mix(in srgb, var(--fg), transparent 92%); border: 1px solid color-mix(in srgb, var(--fg), transparent 70%); }
    .hint { color: var(--muted); font-size: 14px; margin-top: 8px; }
  </style>

  <script>
    // --- 유틸: 초안 자동 저장(간단 throttle) ---
    function throttle(fn, wait){
      // 이벤트를 감지할 때마다 곧바로 로컬스토리지에 저장되는 것을 막기위한 throttle 함수 미리 정의 => 후에 saver에서 호출
      // mission 6에서 정의한 debounce와 비슷하나, debounce는 키보드 치는걸 완전히 멈추고 시간이 지난 후 저장하는 방식이고 throttle은 시간을 정해두고 그 일정 주기 동안 중간 중간 무조건 저장하는 방식
      // fn: 시간이 지났을 때 실제로 실행할 함수
      // wait: 몇 초마다 한 번씩 실행되게 제한할 것인지 정하는 대기 시간
      let t = 0, 
      // 가장 최근에 함수가 실행되었던 시간을 기억해두는 변수 즉, 마지막으로 저장한 시간을 계속 기억해 둘 시계
      // 처음에는 0
      lastArgs = null;
      // 사용자가 타이핑할 때마다 들어오는 글자 내용 중 가장 최신의 내용을 잠깐 담아두는 바구니
      
      return function(...args){
        // 쓰로틀을 호출하는 순간 즉시 실행되는게 아니라 0.5초 주기의 규칙이 내장된 새로운 맞춤형 함수가 리턴됨 => 이 리턴된 함수가 나중에 input 이벤트 마다 대신 호출됨
        // ...args라는 주머니에 사용자가 입력한 값들이 저장되어 있음
        const now = Date.now();
        lastArgs = args;

        if(now - t >= wait){
          // 마지막으로 저장한 시간(t)부터 지금(now)까지 0.5(wait)초 이상 지났는지 체크
          t = now;
          // 시간이 지났다면 기준시간(t)를 현재 시간으로 갱신한 뒤, 즉시 저장함수 fn을 실행함
          fn.apply(this, args);
          // 그냥 fn(args)라고 써버리면 글자만 전달되는 게 아니라 주머니 통쨰로 던져져서 저장 함수가 고장남
          // 주머니를 풀어서 안에든 내용물만 전달하려고 할 때 사용하는 명령어가 apply
          // fn(...args)로 표현도 가능
        } 
        else {
          // 0.5초가 지나지 않았다면 쓰로틀 주기에 맞지 않기 때문에 지금 당장은 저장하지 않음
          clearTimeout(throttle._tid);
          // 타이머를 초기화
          throttle._tid = setTimeout(() => {
            // setTimeout은 타이머 켜기 => 컴퓨터가 어떤 알람을 설정했는지 기억
            // 켠 타이머를 throttle._tid에 저장
            t = Date.now();
            // 가장 최근에 저장한 시간 초기화
            fn.apply(this, lastArgs);
          }, wait - (now - t));
          // "처음부터 다시 1초를 세기 시작하면 주기가 밀리니까, 이미 지나간 시간(now - t)을 총 대기 시간에서 빼서, 딱 남은 잔여 시간만큼만 정확하게 기다렸다가 주기를 칼같이 맞추겠다"
        }
      }
    }

    // 1) DOMContentLoaded → 즉시 반응해야 하는 DOM 작업
    document.addEventListener("DOMContentLoaded", () => {
      console.log("🚀 DOMContentLoaded - DOM 준비 완료");
      // HTML의 구조가 완전히 로딩되는 순간 바로 이 코드들을 실행하라

      // 사용자 이름/알림 배지 표시 (즉시)
      const usernameEl = document.getElementById("username");
      usernameEl.textContent = "홍길동님, 환영합니다!";
      // HTML 문서에서 id가 username인 요소를 찾아와 변수에 담고 그 안에 textContent를 꽂아넣음

      const badge = document.createElement("span");
      // 자바스트립트로 span태그 새로 만듦
      badge.className = "badge";
      // 거기에 클래스 이름 붙이기
      badge.textContent = "3";
      // 내용으로는 숫자 3
      usernameEl.appendChild(badge);
      // usernameEl에 붙여넣기

      // draft 복원
      const cached = localStorage.getItem("draft");
      // 로컬 저장소에 draft라는 이름으로 저장해 둔 임시 글이 있는지 확인하고 변수 cached에 담기
      if (cached) document.getElementById("report").value = 
      cached;
      // 만약 저장해둔 내용이 있다면 id가 report인 태그의 내용물로 채워 넣음 => 사용자의 글 복원

      // 입력 중엔 자동 저장(throttle)
      const saver = throttle((val) => localStorage.setItem("draft", val), 500);
      // 쓰로틀 함수를 호출해서 0.5초마다 주기적으로 입력받은 값(val)을 로컬 저장소에 저장하는 saver버튼 생성
      document.getElementById("report").addEventListener("input", e => saver(e.target.value));
      // 사용자가 입력창 (id=report)에 인풋 이벤트를 발생시키면 그 내용을 아까 만들어 둔 saver함수에 전달 => 쓰로틀 호출 => 0.5초의 주기로 저장 수행
    });

    // 2) load → 이미지(리소스) 의존 레이아웃 계산
    window.addEventListener("load", () => {
      // HTML의 뼈대뿐만 아니라 이미지, 스타일 시트 등 모든 리소스 파일이 완전히 다운로드 되고 로딩이 끝난 순간에 아래 코드 실행
      console.log("🌎 load - 모든 리소스 로딩 완료");
      const banner = document.getElementById("banner");
      const card = document.getElementById("card");
      // HTML에서 배너 이미지와 카드를 감싸는 박스를 골라와서 변수에 담기

      // 배너 실제 높이 기반으로 카드 높이 반영
      const h = banner.naturalHeight;   
      // naturalHeight란 이미지 파일이 가진 실제 높이 픽셀을 의미
      card.style.height = Math.max(h, 140) + "px";  
      // 최소 높이 가드
      // max(a,b)는 둘 중에 더 큰 숫자를 선택하라는 의미
      // 만약 배너 이미지가 너무 작거나 로딩에 문제가 생겨서 높이가 잘못 계산되어 나온다면 최소 가이드라인인 140px이 선택되어 카드가 찌그러지는 것을 막아줌
      console.log("카드 높이(정확히 반영):", card.style.height);
    });

    // 3) beforeunload → 데이터 보호(경고 + draft 보존)
    window.addEventListener("beforeunload", (event) => {
      // 페이지를 이동하거나 종료되기 직전에 실행되는 코드
      const text = document.getElementById("report").value;
      // id=report에 적힌 글자들을 가져와서 text 변수에 담기
      if (text.trim() !== "") {
        // 만약 그 내용이 빈칸이 아니라면 아래 코드 실행
        localStorage.setItem("draft", text); // 초안 저장
        // saver을 정의할 때 만들어 둔 변수 draft
        // 로컬 저장소에 text내용을 draft라는 이름표를 붙여서 저장
        event.preventDefault();

        event.returnValue = "";              
        // 브라우저 기본 경고
      }
    });

    // 4) unload → 세션 종료 로그(신뢰성 ↑)
    window.addEventListener("unload", () => {
      const payload = JSON.stringify({
        // 서버가 읽을 수 있는 문자열 형태로 변환하여 payLoad 변수에 담기
        sessionId: "sess-" + Math.floor(performance.timeOrigin),
        // 세션 아이디 만들기
        end: Date.now(),
        // 사용자가 웹사이트를 떠나고 있는 정확한 시간 기록
        page: location.pathname,
        // 웹페이지의 주소 경로 기록
        timeSpentMs: Math.round(performance.now())
        // 웹페이지가 켜진 순간부터 지금 나갈 때까지 흘러간 총 시간을 밀리초로 계산하여 저장
      });
      // sendBeacon: 종료 직전에도 비동기 전송 시도(완전 보장은 아님)
      navigator.sendBeacon("/analytics/exit", payload);
      // 브라우저가 닫히는 와중에도 서버로 데이터를 안전하게 전송
    });
  </script>
</head>
<body>
  <header>
    <h1 id="username">로딩 중...</h1>
    <p class="hint">※ DevTools → Performance에서 Timings(🚀DOMContentLoaded / 🌎load) 마커를 캡처해 비교하세요.</p>
  </header>

  <!-- 유효한 이미지: 데이터 URI(SVG, 800×200) -->
  <img id="banner"
       alt="배너 이미지"
       src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='800' height='200'%3E%3Cdefs/%3E%3Crect width='100%25' height='100%25' fill='%23dbeafe'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='32' fill='%231d4ed8'%3EAnalytics%20Banner%20800x200%3C/text%3E%3C/svg%3E" />

  <section id="card">
    <p>카드 콘텐츠(배너 높이에 맞춰 세로 크기가 지정됩니다)</p>
  </section>

  <textarea id="report" placeholder="여기에 보고서를 작성하세요(작성 중 이탈 시에도 draft가 보존됩니다)"></textarea>
</body>
</html>
