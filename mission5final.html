<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>예약 확인 & 영수증 (최적화)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 폰트 최적화 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <!-- 히어로 이미지 우선 힌트 -->
  <link rel="preload" as="image" href="https://picsum.photos/1200/600?random=11">

  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--ink:#0f172a;--muted:#6b7280;--border:#e5e7eb;--brand:#2563eb}
    *{box-sizing:border-box}
    body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;margin:0;background:var(--bg);color:var(--ink)}
    header{padding:16px 20px;background:#fff;border-bottom:1px solid var(--border)}
    main{max-width:980px;margin:0 auto;padding:20px}
    .hero{display:flex;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
    .hero img{width:600px;height:auto;aspect-ratio:2/1;border-radius:10px;flex:0 0 auto}
    .info{flex:1}
    .muted{color:var(--muted);margin-top:4px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .btn{padding:10px 14px;border:0;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    .btn.outline{background:#fff;color:var(--ink);border:1px solid var(--border)}
    .receipt{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px}
    .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f5}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
    .thumbs img{display:block;width:100%;height:auto;aspect-ratio:2/1;border-radius:8px}
    [data-lazy]{content-visibility:auto;contain-intrinsic-size:800px 600px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
    .modal .box{background:#fff;border-radius:12px;padding:16px;max-width:90%;width:560px}
    @media print{
      header,.actions,.thumbs,.modal{display:none !important}
      body{background:#fff}
      .receipt{border:0; break-inside: avoid}
      .line strong{font-family:ui-monospace,Menlo,monospace}
    }
    /* 
    인쇄할 때만 적용되는 css
    화면에서는 적용되지 않고 인쇄 미리보기나 실제 인쇄 시에만 적용됨
    !important를 사용하여 다른 스타일보다 우선 적용되도록 함
    break-inside: avoid는 페이지 나누기 시에 해당 요소가 잘리지 않도록 함
    */
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  </style>

  <script defer>
    // defer을 사용하면 자바스크립트 떄문에 HTML 렌더링이 지연되지 않고, DOMContentLoaded 이벤트 전에 실행됨
    addEventListener('DOMContentLoaded', () => {
      // 브라우저가 HTML을 모두 파싱하고 DOM 트리를 완성한 후에 실행되는 이벤트
      const $=(s)=>document.querySelector(s);
      // $는 querySelector의 단축 함수, CSS 선택자를 사용하여 요소를 선택
      const status=$('#status');
      // #status 아이디를 가진 요소를 선택하여 status 변수에 저장
      const announce=(msg)=>{status.textContent=msg};
      // announce 함수는 웹사이트에서 어떤 행동을 했을 때 사용자에게 상태 메시지를 전달하는 역할
      // status 요소의 textContent를 msg로 바꿔서 화면 리더가 읽도록 함

      const codeEl=$('#code');
      const modal=$('#modal'), mTitle=$('#modal-title'), mBody=$('#modal-body');
      const buttons={
        print:$('#btn-print'), invoice:$('#btn-invoice'), copy:$('#btn-copy'),
        share:$('#btn-share'), map:$('#btn-map'), cal:$('#btn-calendar'),
        toggle:$('#btn-toggle-items')
      };
      // 버튼들을 객체로 묶어서 관리, 각각의 버튼에 대한 참조를 저장
      // 나중에 꺼내 쓸 때 buttons.print, buttons.invoice 등으로 접근 가능
      const items=$('#items');

      const immediateUI=(btn,txt,job)=>{
        const prev=btn.textContent;
        // 원래 버튼에 적혀있던 글자를 나중에 복원하기 위해 prev에 저장 
        btn.disabled=true; 
        // 사용자가 버튼을 여러 번 누르는 것을 방지하기 위해 버튼을 비활성화
        btn.textContent=txt; announce(txt);
        // 앞서 만들었던 announce 함수를 사용하여 상태 메시지를 스크린 리더에게 전달
        setTimeout(async()=>{ try{await job()}finally{btn.textContent=prev;btn.disabled=false}},0);
        // setTimeout을 사용하여 job 함수를 비동기적으로 실행, UI 업데이트 후 바로 실행되도록 함
        // await job()을 통해 전달받은 무거운 일(서버 통신 등)이 끝날 때까지 기다림
        // finally 블록은 일이 성공하든 실패하든 항상 실행되는 부분으로, 작업이 끝나면 글자를 원래대로 돌리고 버튼을 다시 활성화
      };
      // 매개변수로 버튼 요소, 표시할 텍스트, 수행할 작업(job)을 받아서 버튼 UI를 즉시 업데이트하고, 작업이 끝나면 원래 상태로 복원
  

      buttons.print.addEventListener('click',()=>immediateUI(buttons.print,'PDF 준비중…',async()=>{window.print()}));
      // print 버튼 클릭 시 immediateUI 함수를 호출하여 버튼 글자를 'PDF 준비중…'로 바꾸고, window.print()를 호출하여 인쇄 대화상자를 띄움
      // 여기서 async()=>{window.print()}이 immediateUI에서 job함수로 인쇄 작업이 끝날 때까지 기다리지 않고 UI를 업데이트


      buttons.invoice.addEventListener('click',()=>immediateUI(buttons.invoice,'전송중…',async()=>{
        await new Promise(r=>setTimeout(r,150));
        alert('세부 영수증을 이메일로 발송했습니다.');
        // 일부러 0.15초 지연을 주어 전송중 상태를 보여주고, 완료되면 알림창으로 발송 완료 메시지를 표시
      }));

      buttons.copy.addEventListener('click',async()=>{
        // async 함수를 사용하여 비동기적으로 클립보드에 텍스트를 복사
        // 클립보드 복사 작업이 완료될 때까지 기다리기 위해 await 사용
        try{await navigator.clipboard.writeText(codeEl.textContent.trim());
          // codeEl.textContent.trim()을 사용하여 예약번호를 가져와 클립보드에 복사
          // trim()은 문자열 앞뒤의 공백을 제거
          // navigator.clipboard.writeText()는 클립보드에 텍스트를 쓰는 브라우저의 공식 클립보드 기능

          buttons.copy.textContent='복사됨!';setTimeout(()=>buttons.copy.textContent='예약번호 복사',900)}
          // 복사 성공 시 버튼 글자를 '복사됨!'으로 바꾸고, 0.9초 후에 다시 '예약번호 복사'로 복원

        catch{alert('복사 실패');}
        // 클립보드 복사 실패 시 알림창으로 '복사 실패' 메시지를 표시
      });

      buttons.share.addEventListener('click',async()=>{
        // 공유 버튼 클릭 시
        const payload={title:'예약 공유',text:'내 예약 정보',url:location.href};
        // 공유할 내용(payload)을 객체로 정의, title, text, url을 포함
        if(navigator.share){try{await navigator.share(payload)}catch{}}
        // navigator.share가 지원되는 브라우저에서는 공유 API를 사용하여 payload를 공유 -> 스마트폰 브라우저가 기본으로 제공하는 공유 네이티브 메뉴를 의미
        // 공유를 취소하거나 실패해도 catch 블록에서 아무 동작을 하지 않음
        else{mTitle.textContent='공유';mBody.innerHTML=`<p>아래 링크를 복사해 공유하세요.</p><input value="${location.href}" style="width:100%">`;modal.style.display='flex'}
        // pc 브라우저는 보통 navigator.share를 지원하지 않으므로, 모달을 띄워서 링크를 복사하도록 안내
        // 미리 만들어둔 모달 창의 제목 mTitle을 공유, 내용 mBody를 현재 웹페이지 주소가 담긴 입력창을 집어넣음
        // modal.style.display='flex'로 모달을 화면에 표시
      });

      buttons.map.addEventListener('click',()=>immediateUI(buttons.map,'지도 로딩…',async()=>{
        mTitle.textContent='호텔 위치';
        mBody.innerHTML=`<iframe src="https://maps.google.com/maps?q=seoul&z=13&output=embed" width="100%" height="320" style="border:0"></iframe>`;
        modal.style.display='flex';
      }));

      buttons.cal.addEventListener('click',()=>immediateUI(buttons.cal,'파일 생성…',async()=>{
        const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:호텔 체크인\nDTSTART:20250903\nDTEND:20250906\nDESCRIPTION:리버사이드 호텔\nEND:VEVENT\nEND:VCALENDAR`;
        const blob=new Blob([ics],{type:'text/calendar'});const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);a.download='reservation.ics';a.click();URL.revokeObjectURL(a.href);
      }));

      buttons.toggle.addEventListener('click',()=>{
        items.hidden=!items.hidden;
        buttons.toggle.textContent=items.hidden?'세부 항목 펼치기':'세부 항목 접기';
      });

      $('#modal-close').addEventListener('click',()=>modal.style.display='none');
      modal.addEventListener('click',(e)=>{if(e.target===modal) modal.style.display='none'});
      addEventListener('keydown',(e)=>{if(e.key==='Escape'&&modal.style.display==='flex')modal.style.display='none'});
    });
  </script>
</head>
<body>
  <header>🏨 예약 확인 & 영수증 (Optimized)</header>
  <main>
    <section class="hero">
      <img src="https://picsum.photos/1200/600?random=11"
           srcset="https://picsum.photos/600/300?random=11 600w, https://picsum.photos/900/450?random=11 900w, https://picsum.photos/1200/600?random=11 1200w"
           sizes="(max-width: 900px) 100vw, 600px"
           fetchpriority="high" decoding="async"
           width="600" height="300" alt="호텔 외관">
      <div class="info">
        <h1>리버사이드 호텔</h1>
        <p class="muted">체크인 2025-09-03 · 체크아웃 2025-09-06 · 예약번호 <code id="code">RSV-8421</code></p>
        <div class="actions">
          <button class="btn" id="btn-print">인쇄 / PDF 저장</button>
          <button class="btn outline" id="btn-invoice">세부 영수증 보기</button>
          <button class="btn outline" id="btn-copy">예약번호 복사</button>
          <button class="btn outline" id="btn-share">공유</button>
          <button class="btn outline" id="btn-map">지도 보기</button>
          <button class="btn outline" id="btn-calendar">캘린더 추가</button>
        </div>
      </div>
    </section>

    <section class="receipt" id="receipt" data-lazy>
      <h3>요금 내역</h3>
      <div class="line"><span>객실 요금(3박)</span><strong>₩420,000</strong></div>
      <div class="line"><span>세금/봉사료</span><strong>₩42,000</strong></div>
      <div class="line"><span>리조트 피</span><strong>₩18,000</strong></div>
      <div class="line"><span><strong>합계</strong></span><strong>₩480,000</strong></div>
      <button class="btn outline" id="btn-toggle-items">세부 항목 펼치기</button>
      <div id="items" hidden>
        <div class="line"><span>룸서비스</span><strong>₩28,000</strong></div>
        <div class="line"><span>미니바</span><strong>₩9,000</strong></div>
      </div>
    </section>

    <section class="thumbs">
      <img loading="lazy" decoding="async"
           src="https://picsum.photos/800/400?random=21"
           srcset="https://picsum.photos/400/200?random=21 400w, https://picsum.photos/800/400?random=21 800w"
           sizes="(max-width: 700px) 100vw, 400px"
           width="400" height="200" alt="객실1">
      <!-- 다른 썸네일도 동일 패턴 -->
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="box">
      <h3 id="modal-title">모달</h3>
      <div id="modal-body">내용</div>
      <button class="btn outline" id="modal-close">닫기</button>
    </div>
  </div>
  <div id="status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
