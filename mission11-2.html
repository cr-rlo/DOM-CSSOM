<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>[BASE] 매거진 랜딩 - 성능 문제</title>

  <!-- Fonts를 받아올 웹사이트 미리 연결 -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  </noscript>
  <!-- 사용자의 브라우저가 자바스크립트를 안쓰거나 꺼둔 상황일 때를 대비 -->

  <!-- <head> 히어로 이미지 미리 다운로드 -->
  <link rel="preload" as="image" href="https://picsum.photos/id/1015/1200/700">


  <style>
    body{margin:0;font-family:Roboto, system-ui, -apple-system, Segoe UI, Noto Sans, sans-serif;line-height:1.6}
    header{padding:24px 16px;border-bottom:1px solid #eee;font-weight:bold;font-size:20px}
    .hero{max-width:1100px;margin:24px auto;padding:0 16px}
    .hero h1{font-size:48px;margin:12px 0}
    .hero img{width:100%; border-radius:12px; height: auto; aspect-ratio: 1200/700;}
    .grid{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card img{width:100%;border-radius:8px}
    .media{max-width:1100px;margin:24px auto;padding:0 16px}
    video{width:100%;border-radius:12px;background:#000}
  </style>
</head>

<body>
  <header>매거진 / Weekly</header>

  <main class="hero">
    <h1>도시의 주말 산책 코스</h1>
    <!-- 모든 이미지를 즉시 로드 -->
    <img src="https://picsum.photos/id/1015/1200/700" 
    width = "1200"
    height="700"
    alt="hero">
    <p>사진과 이야기가 있는 주말, 도시 속 자연을 걸어요.</p>
  </main>

  <section class="grid">
    <article class="card"><img data-src="https://picsum.photos/id/1025/600/400" alt=""></article>
    <article class="card"><img data-src="https://picsum.photos/id/1035/600/400" alt=""></article>
    <article class="card"><img data-src="https://picsum.photos/id/1045/600/400" alt=""></article>
    <article class="card"><img data-src="https://picsum.photos/id/1055/600/400" alt=""></article>
    <article class="card"><img data-src="https://picsum.photos/id/1065/600/400" alt=""></article>
    <article class="card"><img data-src="https://picsum.photos/id/1075/600/400" alt=""></article>
    <!-- 브라우저는 src라는 이름이 붙어있어야만 사진을 다운해야함을 인지하고 다운함 => 여기에 data-를 붙이게되면 브라우저가 이를 무시하고 사진을 다운하지 않게됨 -->
  </section>
  

  <section class="media">
    <h2>도심 산책 브이로그</h2>

    <!-- preload=metadata와 poster를 이용한 최적화 버전 -->
    <video controls preload="metadata" poster="https://picsum.photos/id/1015/1200/700">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>
  </section>

  <script>
    // data-를 붙여 다운을 미뤄둔 grid를 여기서 다운로드 
    const imageObserver = new IntersectionObserver((entries, observer) => {
      // IntersecionObserver는 브라우저 내장 기능으로 화면에 들어왔는지 확인하는 센서
      // 첫번쨰 매개변수 entries는 상태에 변화가 생긴 요소들의 묶음
      // 두번째 매개변수 observer는 감지 센서 자체 => 나중에 감지를 중단시키기 위해 지목하는 본체가 됨
      entries.forEach(entry => {
        // 묶음들을 하나씩 꺼낸 entry
        if (entry.isIntersecting){
          // 화면에 들어온 이 요소가 isIntersecting = true일 경우, 즉 화면으로 진입했다면(화면 영역과 요소가 겹치고 있다면)
          const img = entry.target;
          // 방금 화면에 들어온 그 요소를 img라는 변수에 담기

          img.src = img.dataset.src;
          // data 속성의 src주소를 가져와서 img.src로 => 브라우저가 다운로드 시작 

          observer.unobserve(img);
          // 감시를 중단하는 브라우저 내장기능
        }
      });
    });

    document.querySelectorAll('section.grid img').forEach(img => {// grid라는 클래스 이름을 가진 section으로 들어가서 img태그들을 전부 다 찾아내기
      // 그 이미지들을 하나씩 꺼내서 센서 부착하기
      imageObserver.observe(img);
      // 위에서 만들어둔 imageObserver에 브라우저 내장함수 observe를 붙여서 감시하기 시작하기 
    });

  </script>
</body>
</html>
